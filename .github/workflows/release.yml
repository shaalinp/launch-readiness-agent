name: release

# A vX.Y.Z tag, pushed by the maintainer, makes a draft release: a zip of the
# tagged commit, its SHA-256 checksum, and a build-provenance attestation.
# The maintainer reviews the draft and publishes it by hand.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - name: Test the tagged commit as a release
        run: node --test tests/*.test.mjs
        env:
          RELEASE_TREE: "1"
      - name: Check the tag, BUILD.json, and CHANGELOG.md agree
        run: |
          node -e '
            const fs = require("node:fs");
            const tag = process.env.GITHUB_REF_NAME;
            if (!/^v\d+\.\d+\.\d+$/.test(tag)) throw new Error(`tag ${tag} is not vX.Y.Z`);
            const build = JSON.parse(fs.readFileSync("BUILD.json", "utf8"));
            if (build.version !== tag) throw new Error(`BUILD.json says ${build.version}, the tag is ${tag}`);
            const log = fs.readFileSync("CHANGELOG.md", "utf8");
            const start = log.search(new RegExp(`^## ${tag.replace(/\./g, "\\.")}\\s*$`, "m"));
            if (start < 0) throw new Error(`CHANGELOG.md has no section for ${tag}`);
            const rest = log.slice(start);
            const next = rest.slice(3).search(/^## /m);
            fs.writeFileSync("release-notes.md", (next < 0 ? rest : rest.slice(0, next + 3)).trim().split("\n").slice(1).join("\n").trim() + "\n");
          '
      - name: Build the zip and its checksum
        run: |
          name="launch-readiness-agent-${GITHUB_REF_NAME}"
          git archive --format=zip --prefix="${name}/" -o "${name}.zip" "${GITHUB_REF_NAME}"
          sha256sum "${name}.zip" > SHA256SUMS
          echo "ZIP=${name}.zip" >> "$GITHUB_ENV"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ZIP }}
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "${ZIP}" SHA256SUMS --draft --verify-tag --title "${GITHUB_REF_NAME}" --notes-file release-notes.md
